name: Stock Scanner

# ใช้ cron-job.org ยิง trigger จากภายนอก (ตรงเวลากว่า GitHub cron)
# ไม่ใช้ schedule ของ GitHub แล้ว เพราะดีเลย์บ่อย
# ยังกดรันเองจากหน้าเว็บได้ผ่าน workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      market:
        description: 'ตลาดที่จะสแกน'
        required: true
        default: 'SET'
        type: choice
        options: [SET, US]
      test_mode:
        description: 'โหมดทดสอบ (สแกนแค่ 5 ตัว เร็ว)'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          MARKET="${{ github.event.inputs.market }}"
          MARKET="${MARKET:-SET}"
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python main_scanner.py --market "$MARKET" --test
          else
            python main_scanner.py --market "$MARKET"
          fi

      - name: Commit cache & progress
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cache progress 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update cache/progress [skip ci]"
          git push || true
